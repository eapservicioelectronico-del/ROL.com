        /* ÁREA DE CONTENIDO */
        .hero-section {
            background-color: #00529c;

        .content-card {
            background: #ffffff; width: 100%; max-width: 950px; min-height: 400px;

        .bloque { margin: 14px 0; padding: 6px 0; }
        .bloque h2 { margin: 0 0 6px; }
        .bloque img, .bloque video { max-width: 100%; border-radius: 8px; display: block; }

        .bloque .pie { font-size: 12px; color: #64748b; margin-top: 4px; }
        .bloque-texto { white-space: pre-wrap; line-height: 1.6; color: #4a5568; font-size: 15px; }

        .editando { outline: 2px dashed #ff9600; outline-offset: 4px; border-radius: 6px; }
        .ctrl-bloque { display: flex; gap: 4px; margin-bottom: 6px; }
        .ctrl-bloque button, .ctrl-seccion button {
            background: #fff7e6; color: #333; border: 1px solid #ff9600; border-radius: 4px;
            padding: 3px 8px; font-size: 12px; cursor: pointer;
        }
        .ctrl-seccion { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; padding-top: 14px; border-top: 2px dashed #ff9600; }

        dialog.dlg { border: none; border-radius: 10px; padding: 22px; width: min(92vw, 460px); box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
        dialog.dlg::backdrop { background: rgba(0,0,0,0.5); }
        dialog.dlg h3 { margin: 0 0 14px; color: #0066bc; }
        dialog.dlg textarea { width: 100%; min-height: 110px; padding: 9px; font: inherit; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px; }
        dialog.dlg .botones { display: flex; gap: 8px; margin-top: 14px; }
        dialog.dlg .botones button { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: #333; cursor: pointer; font-weight: 600; }
        dialog.dlg .botones button.ok { background: #0066bc; color: #fff; border-color: #0066bc; }
        dialog.dlg .check { display: flex; align-items: center; gap: 8px; }
        dialog.dlg .check input { width: auto; margin: 0; }

        :focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }

        /* ==========================================================================
           3. CELULARES
           ========================================================================== */
        @media (max-width: 768px) {
            .custom-navbar { flex-wrap: wrap; height: auto; padding: 10px 15px; }
            .nav-tabs-container { order: 3; width: 100%; flex-basis: 100%; margin-left: 0; padding-bottom: 5px; }
            .hero-section { min-height: calc(100vh - 110px); padding: 15px 10px; }
            .content-card { padding: 20px 15px; min-height: auto; }
            .content-card h1 { font-size: 22px; }
        }
    </style>
</head>

    <script type="application/json" id="datos">{"version":1,"config":{"miembros":{"sal":"0b06b91ac304b5f9fb9156a3584adb69","hash":"5e9a33b46d7994ab4df1f024b822085448f8963486d2d1e10504f29f5c3b5fb3"},"github":{"usuario":"eapservicioelectronico-del","repo":"ROL.com","rama":"main","ruta":"index.html"}},"secciones":[{"id":"historia","titulo":"Historia","privada":false,"bloques":[{"tipo":"texto","titulo":"","texto":"La Comunidad Rol San Francisco nace de la necesidad de consolidar un espacio de encuentro e integración cultural en San Francisco, Córdoba. A lo largo de nuestra trayectoria, hemos desarrollado eventos mensuales, talleres y proyectos comunitarios orientados a la libre expresión, el diseño estratégico y la narración colaborativa."}]},{"id":"noticias","titulo":"Noticias y Novedades","privada":false,"bloques":[{"tipo":"texto","titulo":"","texto":"Módulo de comunicación interna para mantener al día a todos los integrantes sobre eventos programados, anuncios importantes del grupo de coordinación y cronogramas de actividades."},{"tipo":"aviso","titulo":"Próximo aviso","texto":"Acá se pueden listar cronológicamente las últimas novedades. Entrá en modo dueño para agregar fotos, videos y enlaces.","color":"naranja"}]},{"id":"manuales","titulo":"Manuales y Documentación","privada":true,"bloques":[{"tipo":"texto","titulo":"","texto":"Espacio de consulta exclusivo para miembros registrados."},{"tipo":"texto","titulo":"1. Manuales de Operación","texto":""},{"tipo":"enlace","texto":"📂 Guía de Inicio Rápido y Dinámicas de Integración","url":""},{"tipo":"enlace","texto":"📂 Procedimientos de Organización y Uso del Espacio Común","url":""},{"tipo":"texto","titulo":"2. Documentación Técnica del Sistema","texto":""},{"tipo":"enlace","texto":"📄 Hojas de Datos (Datasheets) y Esquemas de Conexión","url":""},{"tipo":"enlace","texto":"📄 Diagramas de Procesos e Informes Técnicos de Respaldo","url":""}]},{"id":"aplicaciones","titulo":"Aplicaciones","privada":true,"bloques":[{"tipo":"texto","titulo":"","texto":"Utilitarios digitales interactivos desarrollados a medida para la optimización de nuestras actividades en tiempo real."},{"tipo":"aviso","titulo":"Entorno operativo habilitado","texto":"Ya podés interactuar con las herramientas de la comunidad.","color":"verde"}]}]}</script>

    <script>
    (function () {
        'use strict';

        // =====================================================================
        // UTILIDADES (se inserta todo con textContent, nunca con innerHTML)
        // =====================================================================
        function el(tag, props) {
            var nodo = document.createElement(tag);
            props = props || {};
            Object.keys(props).forEach(function (k) {
                var v = props[k];
                if (k === 'class') nodo.className = v;
                else if (k === 'text') nodo.textContent = v;
                else if (k.indexOf('on') === 0) nodo.addEventListener(k.slice(2), v);
                else nodo.setAttribute(k, v);
            });
            Array.prototype.slice.call(arguments, 2).forEach(function (h) {
                [].concat(h).forEach(function (x) { if (x) nodo.append(x); });
            });
            return nodo;
        }
        var clonar = function (o) { return JSON.parse(JSON.stringify(o)); };
        function urlHttps(u) { try { return new URL(u).protocol === 'https:'; } catch (e) { return false; } }
        function imagenValida(s) { return urlHttps(s) || /^data:image\/(jpeg|png|webp|gif);base64,/.test(s || ''); }

        function analizarVideo(url) {
            try {
                var u = new URL(url);
                if (u.protocol !== 'https:') return null;
                var id = null;
                if (u.hostname === 'youtu.be') id = u.pathname.slice(1);
                else if (/(^|\.)youtube\.com$/.test(u.hostname)) {
                    id = u.searchParams.get('v') || (/^\/(embed|shorts)\//.test(u.pathname) ? u.pathname.split('/')[2] : null);
                }
                if (id && /^[\w-]{11}$/.test(id)) return { tipo: 'yt', src: 'https://www.youtube-nocookie.com/embed/' + id };
                if (/\.(mp4|webm)$/i.test(u.pathname)) return { tipo: 'file', src: url };
            } catch (e) {}
            return null;
        }

        // =====================================================================
        // SEGURIDAD: claves con PBKDF2 (nunca en texto plano)
        // =====================================================================
        var enc = new TextEncoder();
        var aHex = function (b) { return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join(''); };
        var deHex = function (h) { return new Uint8Array(h.match(/../g).map(function (x) { return parseInt(x, 16); })); };

        async function derivar(clave, salHex) {
            var base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveBits']);
            var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: deHex(salHex), iterations: 100000, hash: 'SHA-256' }, base, 256);
            return aHex(bits);
        }
        async function crearClave(clave) {
            var sal = aHex(crypto.getRandomValues(new Uint8Array(16)));
            return { sal: sal, hash: await derivar(clave, sal) };
        }
        async function verificar(clave, g) {
            if (!g || !g.sal || !g.hash) return false;
            return (await derivar(clave, g.sal)) === g.hash;
        }

        // =====================================================================
        // ALMACÉN: contenido publicado (en este mismo archivo) y borrador local
        // =====================================================================
        var LS_BORRADOR = 'rsf1_borrador', LS_DUENO = 'rsf1_clave_dueno', LS_CONTRASTE = 'rsf1_contraste';
        var leerLS = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
        var escribirLS = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

        function validarContenido(c) {
            if (!c || !Array.isArray(c.secciones) || !c.secciones.length) throw new Error('Contenido inválido');
            c.config = c.config || {};
            c.secciones.forEach(function (s) { s.bloques = Array.isArray(s.bloques) ? s.bloques : []; });
            return c;
        }

        function descargar(nombre, tipo, texto) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
            a.download = nombre;
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }

        // Genera un index.html nuevo con el contenido actual ya incluido
        function generarHTML(cont) {
            var clon = document.documentElement.cloneNode(true);
            clon.querySelector('#content-target').replaceChildren();
            clon.querySelector('#nav-tabs').replaceChildren();
            var barraClon = clon.querySelector('#barra-dueno');
            barraClon.replaceChildren();
            barraClon.setAttribute('hidden', '');
            clon.querySelectorAll('dialog').forEach(function (d) { d.remove(); });
            clon.querySelector('body').removeAttribute('class');
            clon.querySelector('#datos').textContent = JSON.stringify(cont).replace(/</g, '\\u003c');
            return '<!DOCTYPE html>\n' + clon.outerHTML;
        }

        // Descarga una copia (funciona en cualquier navegador)
        function guardarComoHTML(cont) {
            descargar('index.html', 'text/html', generarHTML(cont));
            estado.sinGuardar = false;
        }

        // ---------- Publicación en GitHub (queda en el código del repositorio) ----------
        var LS_TOKEN = 'rsf1_gh_token';
        var tokenMem = null;
        var getToken = function () { return tokenMem || leerLS(LS_TOKEN) || ''; };

        function aBase64(texto) {
            var bytes = new TextEncoder().encode(texto), bin = '';
            for (var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
            return btoa(bin);
        }

        async function configurarGitHub() {
            var g = (estado.cont.config.github) || { rama: 'main', ruta: 'index.html' };
            var r = await formulario('Conexión con GitHub', [
                { name: 'usuario', label: 'Usuario u organización de GitHub' },
                { name: 'repo', label: 'Nombre del repositorio' },
                { name: 'rama', label: 'Rama (normalmente main)' },
                { name: 'ruta', label: 'Archivo de la página en el repo (normalmente index.html)' },
                { name: 'token', label: 'Token de acceso (fine-grained, permiso Contents: Read and write)', tipo: 'password' },
                { name: 'recordar', label: 'Recordar el token en este navegador', tipo: 'check' }
            ], { usuario: g.usuario, repo: g.repo, rama: g.rama, ruta: g.ruta, recordar: !!leerLS(LS_TOKEN) }, function (o) {
                var ok = /^[\w.-]+$/;
                if (!ok.test(o.usuario) || !ok.test(o.repo)) return 'Usuario y repositorio: solo letras, números, punto, guion.';
                if (!o.rama || !o.ruta) return 'Completá rama y archivo.';
                if (!o.token && !getToken()) return 'Pegá tu token de acceso.';
                return '';
            });
            if (!r) return false;
            estado.cont.config.github = { usuario: r.usuario, repo: r.repo, rama: r.rama, ruta: r.ruta.replace(/^\/+/, '') };
            if (r.token) tokenMem = r.token;
            if (r.recordar && getToken()) escribirLS(LS_TOKEN, getToken());
            else { try { localStorage.removeItem(LS_TOKEN); } catch (e) {} }
            cambio();
            return true;
        }

        async function publicarGitHub() {
            var g = estado.cont.config.github;
            if (!g || !getToken()) { if (!(await configurarGitHub())) return; g = estado.cont.config.github; }
            var tok = getToken();
            var api = 'https://api.github.com/repos/' + g.usuario + '/' + g.repo + '/contents/' + g.ruta.split('/').map(encodeURIComponent).join('/');
            var cab = { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            estado.aviso = 'Publicando…'; dibujarBarra();
            try {
                var sha = null;
                var rg = await fetch(api + '?ref=' + encodeURIComponent(g.rama), { headers: cab });
                if (rg.status === 200) sha = (await rg.json()).sha;
                else if (rg.status !== 404) throw new Error(mensajeGitHub(rg.status));
                var cuerpo = { message: 'Actualización desde el modo dueño', content: aBase64(generarHTML(estado.cont)), branch: g.rama };
                if (sha) cuerpo.sha = sha;
                var rp = await fetch(api, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, cab), body: JSON.stringify(cuerpo) });
                if (!rp.ok) throw new Error(mensajeGitHub(rp.status));
                estado.sinGuardar = false;
                estado.aviso = '✓ Publicado en GitHub (' + new Date().toLocaleTimeString() + '). El sitio se actualiza en ~1 minuto.';
            } catch (e) {
                estado.aviso = '⚠ No se pudo publicar: ' + e.message;
            }
            dibujarBarra();
        }

        function mensajeGitHub(s) {
            if (s === 401) return 'token inválido o vencido (401).';
            if (s === 403) return 'el token no tiene permiso de escritura en el repo (403).';
            if (s === 404) return 'repo, rama o archivo no encontrado, o el token no tiene acceso (404).';
            if (s === 409 || s === 422) return 'conflicto: el archivo cambió en GitHub mientras editabas. Volvé a publicar (' + s + ').';
            return 'error de GitHub (' + s + ').';
        }

        // =====================================================================
        // DIBUJO DE BLOQUES
        // =====================================================================
        function dibujarBloque(b) {
            var caja = el('div', { class: 'bloque' });
            var pie = function (t) { return t ? el('div', { class: 'pie', text: t }) : null; };

            if (b.tipo === 'texto') {
                if (b.titulo) caja.append(el('h2', { text: b.titulo }));
                if (b.texto) caja.append(el('div', { class: 'bloque-texto', text: b.texto }));
            } else if (b.tipo === 'aviso') {
                var cls = 'technical-box' + (b.color === 'naranja' ? ' naranja' : b.color === 'verde' ? ' verde' : '');
                var caja2 = el('div', { class: cls });
                if (b.titulo) caja2.append(el('strong', { text: b.titulo + ': ' }));
                caja2.append(document.createTextNode(b.texto || ''));
                caja.append(caja2);
            } else if (b.tipo === 'imagen' && imagenValida(b.src)) {
                caja.append(el('img', { src: b.src, alt: b.pie || 'Imagen', loading: 'lazy' }), pie(b.pie));
            } else if (b.tipo === 'video') {
                var v = analizarVideo(b.url);
                if (v && v.tipo === 'yt') {
                    caja.append(el('iframe', { src: v.src, title: b.pie || 'Video', allowfullscreen: '', referrerpolicy: 'strict-origin-when-cross-origin' }), pie(b.pie));
                } else if (v) {
                    caja.append(el('video', { src: v.src, controls: '' }), pie(b.pie));
                }
            } else if (b.tipo === 'enlace') {
                caja.append(el('div', { class: 'doc-item' },
                    urlHttps(b.url)
                        ? el('a', { href: b.url, target: '_blank', rel: 'noopener noreferrer', text: b.texto || b.url })
                        : el('span', { text: b.texto || '' })));
            }
            return caja;
        }

        // =====================================================================
        // DIÁLOGOS
        // =====================================================================
        var MAX_LADO = 900;
        function reducirImagen(archivo) {
            return new Promise(function (res, rej) {
                var img = new Image();
                var url = URL.createObjectURL(archivo);
                img.onload = function () {
                    var k = Math.min(1, MAX_LADO / Math.max(img.width, img.height));
                    var c = document.createElement('canvas');
                    c.width = Math.round(img.width * k);
                    c.height = Math.round(img.height * k);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    URL.revokeObjectURL(url);
                    res(c.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = function () { rej(new Error('No se pudo leer la imagen')); };
                img.src = url;
            });
        }

        // campos: {name,label,tipo:'text'|'textarea'|'password'|'select'|'check'|'imagen', opciones}
        function formulario(titulo, campos, valores, validar) {
            valores = valores || {};
            return new Promise(function (resolver) {
                var dlg = el('dialog', { class: 'dlg' });
                var error = el('div', { class: 'aviso-error', role: 'alert' });
                var ctrl = {};
                var form = el('form', { method: 'dialog' }, el('h3', { text: titulo }));

                campos.forEach(function (c) {
                    var id = 'f-' + c.name, entrada;
                    if (c.tipo === 'textarea') entrada = el('textarea', { id: id });
                    else if (c.tipo === 'select') entrada = el('select', { id: id }, c.opciones.map(function (o) { return el('option', { value: o[0], text: o[1] }); }));
                    else if (c.tipo === 'check') entrada = el('input', { id: id, type: 'checkbox' });
                    else if (c.tipo === 'imagen') {
                        entrada = el('input', { id: id, type: 'file', accept: 'image/*' });
                        ctrl[c.name + '_url'] = el('input', { id: id + '-url', type: 'url', placeholder: '…o pegá un enlace https://' });
                    } else entrada = el('input', { id: id, type: c.tipo || 'text', autocomplete: 'off' });

                    if (c.tipo === 'check') entrada.checked = !!valores[c.name];
                    else if (c.tipo !== 'imagen' && valores[c.name] != null) entrada.value = valores[c.name];
                    if (c.tipo === 'imagen' && urlHttps(valores[c.name])) ctrl[c.name + '_url'].value = valores[c.name];

                    ctrl[c.name] = entrada;
                    var grupo = el('div', { class: 'form-group' });
                    if (c.tipo === 'check') grupo.append(el('label', { class: 'check', for: id }, entrada, c.label));
                    else { grupo.append(el('label', { for: id, text: c.label }), entrada); if (ctrl[c.name + '_url']) grupo.append(ctrl[c.name + '_url']); }
                    form.append(grupo);
                });

                var cancelar = el('button', { type: 'button', text: 'Cancelar', onclick: function () { dlg.close(); } });
                var ok = el('button', { type: 'submit', class: 'ok', text: 'Aceptar' });
                form.append(error, el('div', { class: 'botones' }, cancelar, ok));

                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    error.textContent = '';
                    var salida = {};
                    try {
                        for (var i = 0; i < campos.length; i++) {
                            var c = campos[i], nodo = ctrl[c.name];
                            if (c.tipo === 'check') salida[c.name] = nodo.checked;
                            else if (c.tipo === 'imagen') {
                                var f = nodo.files[0];
                                salida[c.name] = f ? await reducirImagen(f) : (ctrl[c.name + '_url'].value.trim() || valores[c.name] || '');
                            } else salida[c.name] = c.tipo === 'password' ? nodo.value : nodo.value.trim();
                        }
                        var msg = validar ? await validar(salida) : '';
                        if (msg) { error.textContent = msg; return; }
                    } catch (err) { error.textContent = err.message; return; }
                    resolver(salida);
                    dlg.close();
                });

                dlg.addEventListener('close', function () { dlg.remove(); resolver(null); });
                dlg.append(form);
                document.body.append(dlg);
                dlg.showModal();
                var primero = form.querySelector('input,textarea,select');
                if (primero) primero.focus();
            });
        }

        var TIPOS = [['texto', 'Texto'], ['aviso', 'Recuadro destacado'], ['imagen', 'Foto / imagen'], ['video', 'Video (YouTube o .mp4)'], ['enlace', 'Enlace o documento']];

        async function editarBloque(actual) {
            var tipo = actual && actual.tipo;
            if (!tipo) {
                var r0 = await formulario('Nuevo bloque', [{ name: 'tipo', label: '¿Qué querés agregar?', tipo: 'select', opciones: TIPOS }]);
                if (!r0) return null;
                tipo = r0.tipo;
            }
            var v = actual || {}, r;
            if (tipo === 'texto') {
                r = await formulario('Texto', [
                    { name: 'titulo', label: 'Título (opcional)' },
                    { name: 'texto', label: 'Texto', tipo: 'textarea' }
                ], v, function (o) { return o.titulo || o.texto ? '' : 'Escribí un título o un texto.'; });
            } else if (tipo === 'aviso') {
                r = await formulario('Recuadro destacado', [
                    { name: 'titulo', label: 'Título (opcional)' },
                    { name: 'texto', label: 'Texto', tipo: 'textarea' },
                    { name: 'color', label: 'Color', tipo: 'select', opciones: [['azul', 'Azul'], ['naranja', 'Naranja'], ['verde', 'Verde']] }
                ], v, function (o) { return o.texto ? '' : 'Escribí un texto.'; });
            } else if (tipo === 'imagen') {
                r = await formulario('Foto / imagen', [
                    { name: 'src', label: 'Archivo', tipo: 'imagen' },
                    { name: 'pie', label: 'Descripción (opcional)' }
                ], v, function (o) { return imagenValida(o.src) ? '' : 'Elegí un archivo o pegá un enlace https.'; });
            } else if (tipo === 'video') {
                r = await formulario('Video', [
                    { name: 'url', label: 'Enlace de YouTube o archivo .mp4 (https)' },
                    { name: 'pie', label: 'Descripción (opcional)' }
                ], v, function (o) { return analizarVideo(o.url) ? '' : 'Usá un enlace https de YouTube o un .mp4/.webm.'; });
            } else {
                r = await formulario('Enlace o documento', [
                    { name: 'texto', label: 'Texto visible' },
                    { name: 'url', label: 'Dirección https:// (opcional)' }
                ], v, function (o) { return !o.texto ? 'Escribí el texto.' : (o.url && !urlHttps(o.url) ? 'La dirección debe empezar con https://' : ''); });
            }
            if (!r) return null;
            r.tipo = tipo;
            return r;
        }

        // =====================================================================
        // APLICACIÓN
        // =====================================================================
        var destino = document.getElementById('content-target');
        var tabs = document.getElementById('nav-tabs');
        var barra = document.getElementById('barra-dueno');
        var btnSesion = document.getElementById('btnSesion');

        var publicado;
        try { publicado = validarContenido(JSON.parse(document.getElementById('datos').textContent)); }
        catch (e) { destino.textContent = 'Error: el contenido del sitio está dañado.'; return; }

        var estado = { cont: publicado, dueno: false, miembro: false, pidiendoClave: false, seccionId: publicado.secciones[0].id, aviso: '', fallos: 0 };

        function seccionActual() {
            return estado.cont.secciones.find(function (s) { return s.id === estado.seccionId; }) || estado.cont.secciones[0];
        }

        function cambio() {
            estado.sinGuardar = true;
            var okLS = escribirLS(LS_BORRADOR, estado.cont);
            estado.aviso = okLS
                ? 'Borrador en este navegador. Tocá "Publicar en GitHub" para dejarlo en el código.'
                : '⚠ Memoria llena: no se pudo guardar el borrador. Publicá ya o usá fotos más livianas.';
            dibujar();
        }

        window.addEventListener('beforeunload', function (e) {
            if (estado.dueno && estado.sinGuardar) { e.preventDefault(); e.returnValue = ''; }
        });

        function dibujarTabs() {
            var activa = seccionActual().id;
            tabs.replaceChildren.apply(tabs, estado.cont.secciones.map(function (s) {
                return el('button', {
                    type: 'button',
                    class: 'nav-tab' + (s.privada ? ' protegida' : '')
                        + (s.privada && (estado.miembro || estado.dueno) ? ' desbloqueada' : '')
                        + (!estado.pidiendoClave && s.id === activa ? ' active' : ''),
                    text: s.titulo,
                    onclick: function () { estado.seccionId = s.id; estado.pidiendoClave = false; dibujar(); }
                });
            }));
            btnSesion.textContent = estado.miembro ? 'Cerrar sesión' : 'Acceso miembros';
        }

        function dibujarBarra() {
            barra.hidden = !estado.dueno;
            if (!estado.dueno) return;
            var entrada = el('input', { type: 'file', accept: 'application/json', hidden: '' });
            entrada.addEventListener('change', async function () {
                try { estado.cont = validarContenido(JSON.parse(await entrada.files[0].text())); estado.seccionId = estado.cont.secciones[0].id; cambio(); }
                catch (e) { alert('Archivo inválido: ' + e.message); }
            });
            barra.replaceChildren(
                el('span', { class: 'estado', text: 'MODO DUEÑO — ' + (estado.aviso || 'los cambios se guardan como borrador en este navegador') }),
                el('button', { class: 'primario', type: 'button', text: 'Publicar en GitHub', onclick: publicarGitHub }),
                el('button', { type: 'button', text: 'Conexión GitHub', onclick: configurarGitHub }),
                el('button', { type: 'button', text: 'Copia de seguridad (.html)', onclick: function () { guardarComoHTML(estado.cont); } }),
                el('button', { type: 'button', text: 'Respaldo .json', onclick: function () { descargar('contenido.json', 'application/json', JSON.stringify(estado.cont, null, 2)); } }),
                el('button', { type: 'button', text: 'Importar .json', onclick: function () { entrada.click(); } }),
                el('button', { type: 'button', text: 'Clave de miembros', onclick: cambiarClaveMiembros }),
                el('button', { type: 'button', text: 'Descartar borrador', onclick: function () {
                    if (!confirm('¿Volver al contenido guardado en el archivo y perder el borrador?')) return;
                    try { localStorage.removeItem(LS_BORRADOR); } catch (e) {}
                    estado.cont = clonar(publicado); estado.seccionId = estado.cont.secciones[0].id; estado.aviso = ''; dibujar();
                } }),
                el('button', { type: 'button', text: 'Salir', onclick: salirDueno }),
                entrada
            );
        }

        function vistaClaveMiembros(titulo) {
            var error = el('div', { class: 'aviso-error', role: 'alert' });
            var campo = el('input', { type: 'password', required: '', autocomplete: 'off' });
            var form = el('form', { onsubmit: async function (e) {
                e.preventDefault();
                if (await verificar(campo.value, estado.cont.config.miembros)) { estado.miembro = true; estado.pidiendoClave = false; dibujar(); }
                else { error.textContent = 'Clave incorrecta.'; campo.value = ''; }
            } },
                el('div', { class: 'form-group' }, el('label', { text: 'Clave de miembros' }), campo),
                el('button', { class: 'btn-submit', type: 'submit', text: 'Entrar' }), error);
            destino.replaceChildren(el('div', { class: 'auth-container' },
                el('h1', { text: titulo }),
                el('p', { text: 'Sección solo para miembros. Ingresá la clave que te dio la coordinación.' }),
                form,
                el('p', { class: 'nota-chica', text: 'MODO PRUEBA: esta barrera es solo visual; no protege información sensible.' })));
            campo.focus();
        }

        function mover(arr, i, d) {
            var j = i + d;
            if (j < 0 || j >= arr.length) return false;
            var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            return true;
        }

        function controlesBloque(s, i) {
            return el('div', { class: 'ctrl-bloque' },
                el('button', { type: 'button', text: '↑', title: 'Subir', onclick: function () { if (mover(s.bloques, i, -1)) cambio(); } }),
                el('button', { type: 'button', text: '↓', title: 'Bajar', onclick: function () { if (mover(s.bloques, i, 1)) cambio(); } }),
                el('button', { type: 'button', text: '✎ Editar', onclick: async function () {
                    var n = await editarBloque(s.bloques[i]);
                    if (n) { s.bloques[i] = n; cambio(); }
                } }),
                el('button', { type: 'button', text: '🗑 Borrar', onclick: function () {
                    if (confirm('¿Borrar este bloque?')) { s.bloques.splice(i, 1); cambio(); }
                } })
            );
        }

        function controlesSeccion(s) {
            var camposSeccion = [
                { name: 'titulo', label: 'Nombre de la pestaña' },
                { name: 'privada', label: 'Solo miembros', tipo: 'check' }
            ];
            var validarNombre = function (o) { return o.titulo ? '' : 'Poné un nombre.'; };
            return el('div', { class: 'ctrl-seccion' },
                el('button', { type: 'button', text: '+ Agregar bloque', onclick: async function () {
                    var b = await editarBloque(null);
                    if (b) { s.bloques.push(b); cambio(); }
                } }),
                el('button', { type: 'button', text: 'Renombrar / privacidad', onclick: async function () {
                    var r = await formulario('Sección', camposSeccion, s, validarNombre);
                    if (r) { s.titulo = r.titulo; s.privada = r.privada; cambio(); }
                } }),
                el('button', { type: 'button', text: '+ Nueva sección', onclick: async function () {
                    var r = await formulario('Nueva sección', camposSeccion, {}, validarNombre);
                    if (!r) return;
                    var nueva = { id: 's' + Date.now().toString(36), titulo: r.titulo, privada: r.privada, bloques: [] };
                    estado.cont.secciones.push(nueva);
                    estado.seccionId = nueva.id;
                    cambio();
                } }),
                el('button', { type: 'button', text: 'Mover pestaña ←', onclick: function () { if (mover(estado.cont.secciones, estado.cont.secciones.indexOf(s), -1)) cambio(); } }),
                el('button', { type: 'button', text: 'Mover pestaña →', onclick: function () { if (mover(estado.cont.secciones, estado.cont.secciones.indexOf(s), 1)) cambio(); } }),
                el('button', { type: 'button', text: '🗑 Borrar sección', onclick: function () {
                    if (estado.cont.secciones.length < 2) { alert('Tiene que quedar al menos una sección.'); return; }
                    if (!confirm('¿Borrar la sección "' + s.titulo + '" y todo su contenido?')) return;
                    estado.cont.secciones = estado.cont.secciones.filter(function (x) { return x !== s; });
                    estado.seccionId = estado.cont.secciones[0].id;
                    cambio();
                } })
            );
        }

        function dibujar() {
            var s = seccionActual();
            estado.seccionId = s.id;
            dibujarTabs();
            dibujarBarra();

            if (estado.pidiendoClave && !estado.miembro) return vistaClaveMiembros('Acceso de miembros');
            if (s.privada && !estado.miembro && !estado.dueno) return vistaClaveMiembros(s.titulo);

            var nodos = [el('h1', { text: s.titulo })];
            s.bloques.forEach(function (b, i) {
                var caja = dibujarBloque(b);
                if (estado.dueno) { caja.classList.add('editando'); caja.prepend(controlesBloque(s, i)); }
                nodos.push(caja);
            });
            if (!s.bloques.length) nodos.push(el('p', { text: 'Esta sección todavía no tiene contenido.' }));
            if (estado.dueno) nodos.push(controlesSeccion(s));
            destino.replaceChildren.apply(destino, nodos);
        }

        // ---- Modo dueño ----
        async function entrarDueno() {
            if (estado.dueno) return;
            if (!window.crypto || !crypto.subtle) { alert('Este navegador no permite el modo dueño (falta WebCrypto).'); return; }
            var guardada = leerLS(LS_DUENO);
            if (!guardada) {
                var r = await formulario('Crear clave de dueño (primera vez)', [
                    { name: 'c1', label: 'Clave nueva (mínimo 10 caracteres)', tipo: 'password' },
                    { name: 'c2', label: 'Repetir clave', tipo: 'password' }
                ], {}, function (o) { return o.c1.length < 10 ? 'Mínimo 10 caracteres.' : o.c1 !== o.c2 ? 'Las claves no coinciden.' : ''; });
                if (!r) return;
                escribirLS(LS_DUENO, await crearClave(r.c1));
            } else {
                if (estado.fallos) await new Promise(function (res) { setTimeout(res, Math.min(estado.fallos * 1500, 15000)); });
                var r2 = await formulario('Modo dueño', [{ name: 'c', label: 'Clave de dueño', tipo: 'password' }]);
                if (!r2) return;
                if (!(await verificar(r2.c, guardada))) { estado.fallos++; alert('Clave incorrecta.'); return; }
            }
            estado.fallos = 0;
            estado.dueno = true;
            var borrador = leerLS(LS_BORRADOR);
            try { estado.cont = borrador ? validarContenido(borrador) : clonar(publicado); } catch (e) { estado.cont = clonar(publicado); }
            estado.aviso = '';
            dibujar();
        }

        function salirDueno() {
            if (estado.sinGuardar && !confirm('Tenés cambios sin publicar. Al salir, la página vuelve a mostrar lo último publicado. ¿Salir igual? (Cancelá y tocá "Publicar en GitHub" primero.)')) return;
            estado.dueno = false;
            estado.miembro = false;
            estado.cont = publicado;
            dibujar();
        }

        async function cambiarClaveMiembros() {
            var r = await formulario('Clave de miembros', [
                { name: 'c1', label: 'Clave nueva (mínimo 6 caracteres)', tipo: 'password' }
            ], {}, function (o) { return o.c1.length < 6 ? 'Mínimo 6 caracteres.' : ''; });
            if (!r) return;
            estado.cont.config.miembros = await crearClave(r.c1);
            cambio();
        }

        // ---- Eventos globales ----
        btnSesion.addEventListener('click', function () {
            if (estado.miembro && !estado.dueno) { estado.miembro = false; estado.pidiendoClave = false; if (seccionActual().privada) estado.seccionId = estado.cont.secciones[0].id; }
            else if (!estado.miembro) estado.pidiendoClave = true;
            dibujar();
        });

        var contraste = leerLS(LS_CONTRASTE) === true;
        document.body.classList.toggle('alto-contraste', contraste);
        document.getElementById('btnContraste').addEventListener('click', function () {
            contraste = !contraste;
            document.body.classList.toggle('alto-contraste', contraste);
            escribirLS(LS_CONTRASTE, contraste);
        });

        // Entrada al modo dueño: Ctrl+Alt+A, o 5 toques rápidos sobre "COMUNIDAD"
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.altKey && e.code === 'KeyA') { e.preventDefault(); entrarDueno(); }
        });
        var clics = 0, temporizador;
        document.getElementById('logo').addEventListener('click', function () {
            clearTimeout(temporizador);
            if (++clics >= 5) { clics = 0; entrarDueno(); return; }
            temporizador = setTimeout(function () { clics = 0; }, 1500);
        });

        dibujar();
    })();
    </script>
